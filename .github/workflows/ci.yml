name: CI

on:
  push:
    branches: [main, uat, dev]
  pull_request:
    branches: [main, uat, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  backend-postgres:
    # The experiments use Postgres-specific SQL (ON CONFLICT, FILTER) in
    # production; SQLite covers the rest of the suite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway container that lives only for this job; no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: culturelens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/culturelens_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_experiments.py tests/test_feedback.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
